services:
  - type: web
    name: albarq-wallet-sms
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PHONE
        value: 783553915
      - key: ADMIN_DEFAULT_PASS
        value: Barq@2026
      - key: DISABLE_OTP
        value: "false"
      - key: SEND_REGISTER_SMS
        value: "false"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
